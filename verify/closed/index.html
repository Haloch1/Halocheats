<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/nox-logo.png" />
    <title>Verification | XenCheats</title>
    <meta name="description" content="Discord verification result for XenCheats." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../styles-v2.css" />
  </head>
  <body>
    <main class="section terms-shell">
      <div class="section-heading reveal">
        <p class="eyebrow">Discord verification</p>
        <h2 id="closedHeading">Finishing up...</h2>
        <p id="closedSubtext">Sending the result back to Discord.</p>
      </div>
      <section class="terms-card reveal" data-delay="80">
        <div id="closedStatus" class="inline-message info">One moment...</div>
        <p style="margin-top:16px">
          <a id="closedDiscordLink" class="button button-secondary" href="https://discord.com/channels/@me" hidden>Return to Discord</a>
        </p>
      </section>
    </main>
    <script type="module" src="../../scripts/verify-closed.js"></script>
  </body>
</html>
